name: Catalog link check

# Every film in the catalog is hosted by archive.org, and items get pulled
# without warning - seven of nineteen broke in a fortnight, and the only
# reason anyone noticed was a viewer clicking a card and getting a dead
# poster frame. This runs the check nightly so the catalog reports on itself.

on:
  schedule:
    # 09:17 UTC, a few minutes off the hour because on-the-hour cron slots are
    # heavily oversubscribed on shared runners and get delayed.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Run against the broken fixture to test the alerting path'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  ISSUE_LABEL: catalog-health

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: check-links.mjs deliberately uses only Node builtins,
      # so there is nothing to install and nothing that can drift.

      - name: Resolve catalog to check
        id: target
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "args=--file scripts/fixtures/broken-catalog.html" >> "$GITHUB_OUTPUT"
            echo "Running against the broken fixture (alerting-path test)."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check catalog
        id: first
        continue-on-error: true
        run: node scripts/check-links.mjs ${{ steps.target.outputs.args }} 2>&1 | tee first.log

      # archive.org rate-limits cloud IPs harder than a home connection, and
      # individual storage nodes drop out for minutes at a time. A single red
      # run is not evidence of a dead film, so confirm before crying wolf.
      - name: Wait, then re-check
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "First pass reported failures. Waiting before confirming."
          sleep 180
          node scripts/check-links.mjs ${{ steps.target.outputs.args }} --suggest 2>&1 | tee second.log

      - name: Build report
        if: always()
        id: report
        run: |
          strip() { sed 's/\x1b\[[0-9;]*m//g' "$1"; }
          if [ "${{ steps.first.outcome }}" = "success" ]; then
            {
              echo "## Catalog healthy"
              echo
              echo '```'
              strip first.log | tail -25
              echo '```'
            } > report.md
            echo "state=healthy" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.second.outcome }}" = "success" ]; then
            {
              echo "## Catalog healthy (first pass was a false alarm)"
              echo
              echo "The first run reported failures but the confirming run passed."
              echo "That is archive.org throttling or a storage node blipping, not link rot."
              echo
              echo '```'
              strip second.log | tail -25
              echo '```'
            } > report.md
            echo "state=healthy" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## Broken catalog entries"
              echo
              echo "Two passes three minutes apart both failed, so this is not throttling."
              echo "Replacement candidates are listed below where the search found any."
              echo
              echo '```'
              strip second.log | tail -80
              echo '```'
              echo
              echo "Reproduce locally with \`npm run check-links\`."
              echo
              echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } > report.md
            echo "state=broken" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing report issue
        if: always()
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --repo "${{ github.repository }}" \
                  --label "$ISSUE_LABEL" --state open \
                  --json number --jq '.[0].number // empty')
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # One open issue at a time. A daily cron that opens a fresh issue every
      # morning for the same dead film trains you to ignore the label.
      - name: File or update issue
        if: steps.report.outputs.state == 'broken'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.existing.outputs.number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.number }}" \
              --repo "${{ github.repository }}" --body-file report.md
            echo "Updated issue #${{ steps.existing.outputs.number }}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Catalog link check: broken entries" \
              --label "$ISSUE_LABEL" --body-file report.md
          fi

      - name: Close the issue once healthy
        if: steps.report.outputs.state == 'healthy' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ steps.existing.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Catalog is healthy again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing automatically."

      - name: Fail if breakage was confirmed
        if: steps.report.outputs.state == 'broken'
        run: |
          echo "Catalog has confirmed broken entries - see the issue and job summary."
          exit 1
